<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCA - Prueba de cámara PC</title>
<style>
  body{font-family:Arial,sans-serif;max-width:760px;margin:32px auto;padding:0 16px;color:#222}
  button{padding:12px 18px;margin:6px;border:0;border-radius:8px;cursor:pointer;font-size:16px}
  #start{background:#1769aa;color:white} #take{background:#16803c;color:white} #stop{background:#ddd}
  video,img{display:block;width:100%;max-width:640px;background:#111;border-radius:8px;margin:16px 0}
  #msg{padding:12px;background:#f2f4f7;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Prueba de cámara SCA (PC)</h1>
<p>Esta página solo comprueba si el navegador puede abrir la cámara. No toma ni envía fotos automáticamente y no se conecta a SCA.</p>
<button id="start">Activar cámara</button>
<button id="take" disabled>Tomar foto de prueba</button>
<button id="stop" disabled>Apagar cámara</button>
<div id="msg">Pulsa “Activar cámara” y permite el acceso cuando el navegador lo solicite.</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" hidden></canvas>
<img id="photo" alt="La foto de prueba aparecerá aquí" hidden>
<script>
let stream = null;
const video = document.getElementById('video');
const msg = document.getElementById('msg');
const start = document.getElementById('start');
const take = document.getElementById('take');
const stop = document.getElementById('stop');
const canvas = document.getElementById('canvas');
const photo = document.getElementById('photo');

start.addEventListener('click', async () => {
  msg.textContent = 'Solicitando acceso a la cámara…';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('getUserMedia no está disponible. Abre el sitio con HTTPS en un navegador actualizado.');
    }
    stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    video.srcObject = stream;
    await video.play();
    video.hidden = false;
    take.disabled = false;
    stop.disabled = false;
    msg.textContent = 'CÁMARA ACTIVADA. Esta prueba no envía la imagen a ningún servidor.';
  } catch (e) {
    msg.textContent = 'FALLO: ' + e.name + '\n' + e.message +
      '\n\nRevisa si otra aplicación está usando la cámara y los permisos del navegador.';
  }
});
take.addEventListener('click', () => {
  if (!stream || !video.videoWidth) {
    msg.textContent = 'La cámara todavía no está lista. Espera un momento y vuelve a intentar.';
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  photo.src = canvas.toDataURL('image/jpeg',0.85);
  photo.hidden = false;
  msg.textContent = 'Foto de prueba capturada localmente. No se ha enviado ni guardado en SCA.';
});
stop.addEventListener('click', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  take.disabled = true;
  stop.disabled = true;
  msg.textContent = 'Cámara apagada.';
});
</script>
</body>
</html>
