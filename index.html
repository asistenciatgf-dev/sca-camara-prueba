<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCA - Cámara PC</title>
<style>
  body{font-family:Arial,sans-serif;max-width:760px;margin:28px auto;padding:0 16px;color:#222}
  button{padding:12px 18px;margin:6px 6px 6px 0;border:0;border-radius:8px;cursor:pointer;font-size:16px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #capture{background:#16803c;color:white}
  #cancel{background:#ddd}
  video,img{display:block;width:100%;max-width:640px;background:#111;border-radius:8px;margin:16px 0}
  #msg{padding:12px;background:#f2f4f7;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>SCA - Cámara de asistencia</h1>
<p>La cámara se activa automáticamente. Encuadra tu rostro y pulsa <b>Tomar y usar foto</b></p>

<button id="capture" disabled>Tomar y usar foto</button>
<button id="cancel">Cancelar</button>

<div id="msg">Solicitando acceso a la cámara…</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" hidden></canvas>

<script>
'use strict';

let stream = null;
let dataUrl = '';
let enviando = false;

const video = document.getElementById('video');
const msg = document.getElementById('msg');
const capture = document.getElementById('capture');
const cancel = document.getElementById('cancel');
const canvas = document.getElementById('canvas');

function stopCamera() {
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
}

async function startCamera() {
  msg.textContent = 'Solicitando acceso a la cámara…';
  capture.disabled = true;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('La cámara no está disponible en este navegador/contexto HTTPS.');
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    capture.disabled = false;
    msg.textContent = 'Cámara lista. Encuadra tu rostro y pulsa “Tomar y usar foto”.';
  } catch (e) {
    msg.textContent = 'No se pudo activar la cámara: ' +
      (e.name || 'Error') + '\n' + (e.message || e) +
      '\n\nPermite el acceso a la cámara en el navegador y vuelve a abrirla desde SCA.';
  }
}

capture.addEventListener('click', () => {
  if (enviando) return;

  if (!stream || !video.videoWidth || !video.videoHeight) {
    msg.textContent = 'La cámara todavía no está lista. Espera unos segundos e inténtalo de nuevo.';
    return;
  }

  if (!window.opener || window.opener.closed) {
    msg.textContent = 'No se encontró la ventana SCA. Cierra esta página y abre la cámara desde el botón de SCA.';
    return;
  }

  try {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const context = canvas.getContext('2d');

    if (!context) throw new Error('No se pudo preparar la imagen.');

    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    dataUrl = canvas.toDataURL('image/jpeg', 0.85);

    enviando = true;
    capture.disabled = true;
    cancel.disabled = true;
    msg.textContent = 'Enviando la selfie a SCA…';

    window.opener.postMessage({
      type: 'SCA_SELFIE_CAPTURED',
      dataUrl: dataUrl
    }, '*');

    stopCamera();
    msg.textContent = 'Selfie enviada a SCA. Puedes volver a la ventana de asistencia.';
    window.setTimeout(() => window.close(), 500);
  } catch (e) {
    enviando = false;
    capture.disabled = false;
    cancel.disabled = false;
    msg.textContent = 'No se pudo enviar la foto: ' + (e.message || e);
  }
});

cancel.addEventListener('click', () => {
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({type: 'SCA_CAMERA_CANCELLED'}, '*');
    }
  } catch (e) {}

  stopCamera();
  window.close();
});

window.addEventListener('beforeunload', stopCamera);

// Al abrir la ventana, solicita automáticamente el permiso y activa la cámara.
startCamera();
</script>
</body>
</html>
